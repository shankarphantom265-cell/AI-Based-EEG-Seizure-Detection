[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-seizure-ai"
version = "1.0.0"
description = "Research prototype for EEG seizure segment classification"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
  "matplotlib>=3.7", "joblib>=1.3"
]

[tool.setuptools.packages.find]
where = ["src"]
